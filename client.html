<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeSimBot - Live Trading Simulator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0a0e17; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        @keyframes fsi { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        .sr:hover { background: rgba(255,255,255,0.03) !important; }
        .bt { transition: all .12s; cursor: pointer; }
        .bt:hover { transform: translateY(-1px); filter: brightness(1.15); }
        .bt:active { transform: translateY(0); }
        .bg:hover { background: rgba(255,255,255,0.06) !important; }
        #loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #f59e0b; font-family: 'Space Grotesk', sans-serif; font-size: 18px; gap: 12px; }
        @media (max-width: 768px) {
          .desktop-only { display: none !important; }
          .mobile-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root"><div id="loading">Connecting to TradeSimBot Server...<div style="font-size:12px;color:#6b7280">Make sure server.js is running</div></div></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/prop-types@15/prop-types.min.js" crossorigin></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('loading');
        if (el) el.innerHTML = '<div style="color:red;font-family:monospace;font-size:14px">' + e.message + '</div>';
      });
    </script>
    <script type="text/babel" src="/client/shared.jsx"></script>
    <script type="text/babel" src="/client/backtest-quality.jsx"></script>
    <script type="text/babel" src="/client/backtest-tab.jsx"></script>
    <script type="text/babel" src="/client/app.jsx"></script>
    <script type="text/babel" src="/client/bootstrap.jsx"></script>
</body>
</html>
